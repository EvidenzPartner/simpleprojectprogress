
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Forschungsprojekt | EvidenzPartner</title>

    <link rel="icon" type="image/png"
          href="../assets/favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F5F7F8;
            font-family: Inter, Roboto, Arial, sans-serif;
            color: #27313D;
        }

        header {
            padding: 20px 24px;
            background: #FFFFFF;
            border-bottom: 1px solid #DCE1E5;
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #182230;
        }

        main {
            max-width: 1050px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .pdf-viewer {
            width: 100%;
            height: 85vh;
            border: 1px solid #DCE1E5;
            border-radius: 12px;
            background: white;
        }

        .download {
            display: inline-block;
            margin: 0 0 20px;
            padding: 12px 20px;
            background: #1FA84B;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .download:hover {
            background: #147D36;
        }
    </style>
</head>

<body>
    <header>
        <h1>Forschungsprojekt</h1>
    </header>

    <main>
        <a class="download"
           href="factsheet.pdf"
           download>
            PDF herunterladen
        </a>

        <iframe
            class="pdf-viewer"
            src="factsheet.pdf"
            title="Informationen zum Forschungsprojekt">
        </iframe>
    </main>
</body>
</html>
